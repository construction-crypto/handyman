<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Tier Registry | Handyman Painting L.L.C.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .brand-red { color: #E31E24; }
        .bg-brand-red { background-color: #E31E24; }
        .bg-brand-black { background-color: #1A1A1A; }
        
        @keyframes float-standard {
            0% { transform: translateY(0px) scale(1); filter: drop-shadow(0 5px 15px rgba(227, 30, 36, 0.4)); }
            50% { transform: translateY(-12px) scale(1.04); filter: drop-shadow(0 20px 25px rgba(227, 30, 36, 0.8)); }
            100% { transform: translateY(0px) scale(1); filter: drop-shadow(0 5px 15px rgba(227, 30, 36, 0.4)); }
        }
        @keyframes float-preferred {
            0% { transform: translateY(0px) scale(1); filter: drop-shadow(0 5px 15px rgba(37, 99, 235, 0.4)); }
            50% { transform: translateY(-12px) scale(1.04); filter: drop-shadow(0 20px 25px rgba(37, 99, 235, 0.8)); }
            100% { transform: translateY(0px) scale(1); filter: drop-shadow(0 5px 15px rgba(37, 99, 235, 0.4)); }
        }
        @keyframes float-supreme {
            0% { transform: translateY(0px) scale(1); filter: drop-shadow(0 5px 15px rgba(217, 119, 6, 0.4)); }
            50% { transform: translateY(-12px) scale(1.04); filter: drop-shadow(0 20px 25px rgba(217, 119, 6, 0.8)); }
            100% { transform: translateY(0px) scale(1); filter: drop-shadow(0 5px 15px rgba(217, 119, 6, 0.4)); }
        }
        @keyframes float-executive {
            0% { transform: translateY(0px) scale(1); filter: drop-shadow(0 5px 15px rgba(147, 51, 234, 0.4)); }
            50% { transform: translateY(-12px) scale(1.04); filter: drop-shadow(0 20px 25px rgba(147, 51, 234, 0.8)); }
            100% { transform: translateY(0px) scale(1); filter: drop-shadow(0 5px 15px rgba(147, 51, 234, 0.4)); }
        }

        .emblem-standard { animation: float-standard 4s ease-in-out infinite; }
        .emblem-preferred { animation: float-preferred 4s ease-in-out infinite; animation-delay: 1s; }
        .emblem-supreme { animation: float-supreme 4s ease-in-out infinite; animation-delay: 2s; }
        .emblem-executive { animation: float-executive 4s ease-in-out infinite; animation-delay: 3s; }
    </style>
</head>
<body class="bg-zinc-50 text-slate-900 min-h-screen flex flex-col justify-between">
    <nav class="py-4 bg-white shadow-md border-b border-zinc-200">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <a href="transparency.html" class="text-sm font-black uppercase tracking-wider hover:text-[#E31E24] transition">← Back to Registry</a>
            <div class="flex gap-2 text-xs font-black uppercase">
                <span class="bg-brand-red text-white px-3 py-1 rounded">Customers</span>
                <a href="contractors-tiers.html" class="bg-zinc-100 text-zinc-600 px-3 py-1 rounded hover:bg-zinc-200">Contractors</a>
                <a href="employees-tiers.html" class="bg-zinc-100 text-zinc-600 px-3 py-1 rounded hover:bg-zinc-200">Employees</a>
                <a href="admin-tiers.html" class="bg-zinc-100 text-zinc-600 px-3 py-1 rounded hover:bg-zinc-200">Admin</a>
            </div>
        </div>
    </nav>
    <main class="flex-grow container mx-auto px-6 py-12 max-w-7xl space-y-12">
        <div class="text-center max-w-2xl mx-auto space-y-2">
            <h1 class="text-3xl md:text-4xl font-black text-black uppercase tracking-tight">
                Customer <span class="brand-red">Tiers</span>
            </h1>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
            <div class="py-6 px-4 space-y-4 flex flex-col items-center text-center">
                <div class="h-52 w-full flex items-center justify-center p-4">
                    <img src="Standard.jpg" alt="Standard Emblem" class="max-h-full max-w-full object-contain emblem-standard">
                </div>
                <div class="space-y-1 w-full mt-2">
                    <span class="text-xs font-mono brand-red font-bold block">TIER 01</span>
                    <h2 class="text-sm font-black uppercase text-black">Standard Emblem</h2>
                </div>
            </div>
            <div class="py-6 px-4 space-y-4 flex flex-col items-center text-center">
                <div class="h-52 w-full flex items-center justify-center p-4">
                    <img src="Preferred.jpg" alt="Preferred Emblem" class="max-h-full max-w-full object-contain emblem-preferred">
                </div>
                <div class="space-y-1 w-full mt-2">
                    <span class="text-xs font-mono text-blue-600 font-bold block">TIER 02</span>
                    <h2 class="text-sm font-black uppercase text-black">Preferred Emblem</h2>
                </div>
            </div>
            <div class="py-6 px-4 space-y-4 flex flex-col items-center text-center">
                <div class="h-52 w-full flex items-center justify-center p-4">
                    <img src="supreme.jpg" alt="Supreme Emblem" class="max-h-full max-w-full object-contain emblem-supreme">
                </div>
                <div class="space-y-1 w-full mt-2">
                    <span class="text-xs font-mono text-amber-600 font-bold block">TIER 03</span>
                    <h2 class="text-sm font-black uppercase text-black">Supreme Emblem</h2>
                </div>
            </div>
            <div class="py-6 px-4 space-y-4 flex flex-col items-center text-center">
                <div class="h-52 w-full flex items-center justify-center p-4">
                    <img src="secret.jpg" alt="Executive Emblem" class="max-h-full max-w-full object-contain emblem-executive">
                </div>
                <div class="space-y-1 w-full mt-2">
                    <span class="text-xs font-mono text-purple-600 font-bold block">TIER 04</span>
                    <h2 class="text-sm font-black uppercase text-black">Executive Emblem</h2>
                </div>
            </div>
        </div>
    </main>
    <footer class="py-8 bg-brand-black text-center text-white border-t-4 border-brand-red mt-16">
        <p class="text-xs uppercase tracking-[0.3em]">© 2026 Handyman Painting L.L.C. | Montevideo, MN</p>
    </footer>
</body>
</html>
