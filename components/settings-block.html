<div class="grid-stack-item-content bg-white rounded-2xl border border-slate-200/80 shadow-md hover:shadow-xl transition-all duration-300 flex flex-col overflow-hidden h-full" data-block-id="settings">
  <div class="widget-header bg-slate-900 text-white px-4 py-2.5 flex justify-between items-center cursor-move border-b border-slate-800 select-none">
    <div class="flex items-center gap-2">
      <span class="text-slate-400 text-xs tracking-widest font-mono cursor-grab hover:text-white" title="Drag to reorder">⋮⋮</span>
      <span class="font-bold text-xs tracking-wide text-white">⚙️ Profile & Account Details</span>
    </div>
    <button type="button" onclick="removeBlock('settings', false)" class="text-slate-400 hover:text-rose-400 p-1 rounded transition text-xs font-bold leading-none" title="Remove block">&times;</button>
  </div>
  <div class="p-4 text-xs space-y-3 overflow-y-auto flex-1 bg-white text-slate-800">
    <form id="profile-settings-form" onsubmit="saveUserProfile(event)" class="space-y-3">
      <div>
        <label class="font-bold text-slate-700 block mb-1">Full Name *</label>
        <input type="text" id="settings-name-input" required placeholder="Your Full Name" class="w-full border rounded-xl p-2.5 font-medium border-slate-300 text-slate-800">
      </div>
      <div>
        <label class="font-bold text-slate-700 block mb-1">Email Address</label>
        <input type="email" id="settings-email-input" readonly disabled class="w-full border rounded-xl p-2.5 font-medium border-slate-200 bg-slate-50 text-slate-500 cursor-not-allowed">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="font-bold text-slate-700 block mb-1">Phone Number</label>
          <input type="tel" id="settings-phone-input" placeholder="(320) 555-0199" class="w-full border rounded-xl p-2.5 font-medium border-slate-300 text-slate-800">
        </div>
        <div>
          <label class="font-bold text-slate-700 block mb-1">Property Address</label>
          <input type="text" id="settings-address-input" placeholder="1012 N 6th St, Montevideo MN" class="w-full border rounded-xl p-2.5 font-medium border-slate-300 text-slate-800">
        </div>
      </div>
      <div class="pt-1 flex items-center justify-between">
        <span id="settings-save-status" class="text-[11px] font-bold text-emerald-600 hidden">✓ Profile Saved</span>
        <button type="submit" class="bg-brand-red hover:bg-red-700 text-white font-bold px-4 py-2 rounded-xl transition shadow-sm text-xs ml-auto">
          💾 Save Profile Changes
        </button>
      </div>
    </form>
  </div>
</div>
