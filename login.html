<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handyman Painting - Customer Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    h2 { margin-top: 0; color: #333; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #ff9900; border: none; color: white; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #e68a00; }
    .toggle { text-align: center; margin-top: 15px; font-size: 14px; }
    .toggle a { color: #0066cc; text-decoration: none; font-weight: bold; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Handyman Painting Portal</h2>
    
    <!-- LOGIN FORM -->
    <div id="login-section">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="login-email" placeholder="customer@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••">
      </div>
      <button onclick="handleLogin()">Log In</button>
      <div class="toggle">
        Need an account? <a href="#" onclick="toggleView('signup')">Sign Up</a>
      </div>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signup-section" class="hidden">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="signup-name" placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="signup-email" placeholder="customer@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signup-password" placeholder="••••••••">
      </div>
      <button onclick="handleSignUp()">Create Account</button>
      <div class="toggle">
        Already have an account? <a href="#" onclick="toggleView('login')">Log In</a>
      </div>
    </div>

    <!-- VERIFICATION FORM -->
    <div id="verify-section" class="hidden">
      <p style="text-align: center; font-size: 14px; color: #666;">Check your email for a verification code.</p>
      <div class="form-group">
        <label>Verification Code</label>
        <input type="text" id="verify-code" placeholder="123456">
      </div>
      <button onclick="handleVerify()">Confirm Code</button>
    </div>
  </div>

  <script>
    const poolData = {
      UserPoolId: 'us-east-2_0KddUFn3N',
      ClientId: '2el0nos2l424pm40sccol616b7'
    };
    const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
    let currentEmail = '';

    function toggleView(view) {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('signup-section').classList.add('hidden');
      document.getElementById('verify-section').classList.add('hidden');

      if (view === 'login') document.getElementById('login-section').classList.remove('hidden');
      if (view === 'signup') document.getElementById('signup-section').classList.remove('hidden');
      if (view === 'verify') document.getElementById('verify-section').classList.remove('hidden');
    }

    function handleSignUp() {
      const name = document.getElementById('signup-name').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      currentEmail = email;

      const attributeList = [
        new AmazonCognitoIdentity.CognitoUserAttribute({ Name: 'email', Value: email }),
        new AmazonCognitoIdentity.CognitoUserAttribute({ Name: 'name', Value: name })
      ];

      userPool.signUp(email, password, attributeList, null, (err, result) => {
        if (err) {
          alert('Sign Up Error: ' + (err.message || err));
          return;
        }
        alert('Account created! Check your email for the verification code.');
        toggleView('verify');
      });
    }

    function handleVerify() {
      const code = document.getElementById('verify-code').value;
      const cognitoUser = new AmazonCognitoIdentity.CognitoUser({
        Username: currentEmail,
        Pool: userPool
      });

      cognitoUser.confirmRegistration(code, true, (err, result) => {
        if (err) {
          alert('Verification Error: ' + (err.message || err));
          return;
        }
        alert('Email verified successfully! You can now log in.');
        toggleView('login');
      });
    }

    function handleLogin() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const authenticationData = { Username: email, Password: password };
      const authenticationDetails = new AmazonCognitoIdentity.AuthenticationDetails(authenticationData);

      const cognitoUser = new AmazonCognitoIdentity.CognitoUser({
        Username: email,
        Pool: userPool
      });

      cognitoUser.authenticateUser(authenticationDetails, {
        onSuccess: (result) => {
          const token = result.getIdToken().getJwtToken();
          localStorage.setItem('userToken', token);
          localStorage.setItem('isLoggedIn', 'true');
          
          alert('Successfully logged in!');
          window.location.href = 'dashboard.html?v=' + new Date().getTime();
        },
        onFailure: (err) => {
          alert('Login Error: ' + (err.message || err));
        }
      });
    }
  </script>
</body>
</html>
