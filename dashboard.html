<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - Handyman Painting L.L.C.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/gridstack@9.0.0/dist/gridstack.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/gridstack@9.0.0/dist/gridstack-all.js"></script>
    <style>
      body {
        margin: 0;
        overflow-x: hidden;
        background-color: #f8fafc;
      }
      .grid-stack-item-content {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .widget-header {
        cursor: move;
        background: #f8fafc;
        border-bottom: 1px solid #e2e8f0;
        padding: 0.65rem 0.9rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .tier-emblem-large {
        width: 104px;
        height: 104px;
        object-fit: contain;
      }

      /* Floating Emblem Animations */
      @keyframes float-standard {
        0% { transform: translateY(0px) scale(1); filter: drop-shadow(0 8px 16px rgba(220, 38, 38, 0.3)); }
        50% { transform: translateY(-8px) scale(1.04); filter: drop-shadow(0 16px 24px rgba(220, 38, 38, 0.5)); }
        100% { transform: translateY(0px) scale(1); filter: drop-shadow(0 8px 16px rgba(220, 38, 38, 0.3)); }
      }
      @keyframes float-preferred {
        0% { transform: translateY(0px) scale(1); filter: drop-shadow(0 8px 16px rgba(37, 99, 235, 0.3)); }
        50% { transform: translateY(-8px) scale(1.04); filter: drop-shadow(0 16px 24px rgba(37, 99, 235, 0.5)); }
        100% { transform: translateY(0px) scale(1); filter: drop-shadow(0 8px 16px rgba(37, 99, 235, 0.3)); }
      }
      @keyframes float-supreme {
        0% { transform: translateY(0px) scale(1); filter: drop-shadow(0 8px 16px rgba(217, 119, 6, 0.3)); }
        50% { transform: translateY(-8px) scale(1.04); filter: drop-shadow(0 16px 24px rgba(217, 119, 6, 0.5)); }
        100% { transform: translateY(0px) scale(1); filter: drop-shadow(0 8px 16px rgba(217, 119, 6, 0.3)); }
      }
      @keyframes float-executive {
        0% { transform: translateY(0px) scale(1); filter: drop-shadow(0 8px 16px rgba(147, 51, 234, 0.3)); }
        50% { transform: translateY(-8px) scale(1.04); filter: drop-shadow(0 16px 24px rgba(147, 51, 234, 0.5)); }
        100% { transform: translateY(0px) scale(1); filter: drop-shadow(0 8px 16px rgba(147, 51, 234, 0.3)); }
      }
      .emblem-standard { animation: float-standard 4s ease-in-out infinite; }
      .emblem-preferred { animation: float-preferred 4s ease-in-out infinite; }
      .emblem-supreme { animation: float-supreme 4s ease-in-out infinite; }
      .emblem-executive { animation: float-executive 4s ease-in-out infinite; }

      /* Paint Swatch Canvas styling */
      .paint-swatch-canvas {
        width: 100%;
        height: 180px;
        border-radius: 0.75rem;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
      }
    </style>
</head>
<body class="p-6 min-h-screen text-slate-800">

    <!-- Top Layout Studio Bar -->
    <div id="top-bar-container" class="bg-white border border-slate-200 text-slate-900 p-3.5 rounded-2xl mb-6 flex justify-between items-center shadow-sm max-w-7xl mx-auto">
      <div class="flex items-center gap-4">
        <span class="text-sm font-black tracking-wider uppercase text-slate-900 border-r border-slate-200 pr-4">Handyman Painting L.L.C.</span>
        <span id="welcome-greeting-text" class="text-xs font-bold text-slate-600">Welcome Back!</span>
      </div>
      <div class="flex items-center gap-3">
        <button type="button" onclick="openBlockCatalog()" id="btn-add-blocks" class="bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs px-3.5 py-1.5 rounded-lg font-bold transition flex items-center gap-1.5 shadow-sm">
          <span>+</span> Customize / Add Blocks & Tools
        </button>
        <button type="button" onclick="saveLayout()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-800 px-3 py-1.5 rounded-lg border border-slate-300 font-medium transition">💾 Save Layout</button>
        <button type="button" onclick="if(window.grid) grid.compact()" class="text-xs text-slate-500 hover:text-slate-800 underline">Auto-Arrange</button>
      </div>
    </div>

    <!-- Main Grid Canvas -->
    <div class="max-w-7xl mx-auto">
        <div class="grid-stack mb-6"></div>
    </div>

    <!-- Block Selection Catalog Modal -->
    <div id="block-catalog-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 flex items-center justify-center p-4">
      <div class="bg-white/95 backdrop-blur-xl rounded-2xl shadow-2xl max-w-2xl w-full p-6 space-y-4 border border-slate-200">
        <div class="flex justify-between items-center border-b pb-3">
          <div>
            <h3 class="font-bold text-slate-900 text-lg">Dashboard Block Catalog</h3>
            <p class="text-xs text-slate-500">Toggle tools on or off to adjust your dashboard layout.</p>
          </div>
          <button type="button" onclick="closeBlockCatalog()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
        </div>
        
        <div class="grid grid-cols-2 gap-3 max-h-96 overflow-y-auto p-1" id="catalog-items-container"></div>

        <div class="flex justify-end border-t pt-3">
          <button type="button" onclick="closeBlockCatalog()" class="px-5 py-2 text-xs font-bold text-white bg-slate-900 rounded-lg hover:bg-slate-800">Done</button>
        </div>
      </div>
    </div>

    <script>
        window.CUSTOMER_DATA = {
            profile: { name: 'John Doe', phone: '', address: '' },
            spend: 0.00,
            tier: 'Standard',
            projects: { current: [], previous: [] },
            invoices: [],
            recommendations: []
        };

        const TIER_THEMES = {
            standard: {
                bgGradient: 'bg-gradient-to-r from-slate-900 via-zinc-900 to-slate-900',
                accentText: 'text-red-400',
                badgeBg: 'bg-red-500/10 text-red-400 border-red-500/20'
            },
            preferred: {
                bgGradient: 'bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900',
                accentText: 'text-blue-400',
                badgeBg: 'bg-blue-500/10 text-blue-400 border-blue-500/20'
            },
            supreme: {
                bgGradient: 'bg-gradient-to-r from-slate-900 via-amber-950 to-slate-900',
                accentText: 'text-amber-400',
                badgeBg: 'bg-amber-500/10 text-amber-400 border-amber-500/20'
            },
            executive: {
                bgGradient: 'bg-gradient-to-r from-slate-900 via-purple-950 to-slate-900',
                accentText: 'text-purple-400',
                badgeBg: 'bg-purple-500/10 text-purple-400 border-purple-500/20'
            }
        };

        const PREMADE_BLOCKS = {
            tier: {
                id: 'tier',
                title: '🏆 Tier & Loyalty Status',
                w: 12, h: 3,
                getContent: () => {
                    const spend = window.CUSTOMER_DATA.spend || 0;
                    const tier = window.CUSTOMER_DATA.tier || 'Standard';
                    const key = tier.toLowerCase();
                    const theme = TIER_THEMES[key] || TIER_THEMES.standard;

                    return `
                    <div class="grid-stack-item-content !border-slate-800 ${theme.bgGradient} text-white shadow-xl" data-block-id="tier">
                      <div class="widget-header !bg-black/40 !border-white/10">
                        <span class="font-bold text-xs ${theme.accentText} uppercase tracking-wider">🏆 ${tier.toUpperCase()} MEMBER STATUS</span>
                        <button type="button" onclick="removeBlock('tier')" class="text-slate-400 hover:text-white text-sm font-bold">&times;</button>
                      </div>
                      <div class="p-6 flex items-center justify-between gap-6 h-full">
                        <div class="flex items-center gap-6">
                          <div class="flex items-center justify-center p-2">
                            <img id="tier-badge-img" src="/${tier}.jpg" alt="${tier} Tier Emblem" class="tier-emblem-large emblem-${key}" onerror="this.src='/Standard.jpg'" />
                          </div>
                          <div>
                            <span class="text-[10px] uppercase font-bold tracking-widest px-2.5 py-1 rounded border ${theme.badgeBg}">Current Rank</span>
                            <h2 id="tier-name-label" class="text-2xl font-black text-white mt-2">${tier} Member</h2>
                            <p class="text-xs text-slate-300 mt-1">Lifetime Account Spend: <span id="tier-spend-label" class="font-bold ${theme.accentText}">$${spend.toFixed(2)}</span></p>
                          </div>
                        </div>
                      </div>
                    </div>`;
                }
            },
            mixer: {
                id: 'mixer',
                title: '🎨 Interactive Paint Mixer Studio',
                w: 6, h: 5,
                getContent: () => `
                <div class="grid-stack-item-content" data-block-id="mixer">
                  <div class="widget-header">
                    <span class="font-bold text-xs text-slate-800">🎨 Interactive Paint Mixer Studio</span>
                    <button type="button" onclick="removeBlock('mixer')" class="text-slate-400 hover:text-slate-600 text-sm font-bold">&times;</button>
                  </div>
                  <div class="p-4 space-y-3 text-xs overflow-y-auto">
                    <p class="text-slate-500 text-[11px]">Mix 2 paint colors together to test custom swirl finishes & color blends.</p>
                    <canvas id="paint-mixer-canvas" class="paint-swatch-canvas"></canvas>
                    <div class="grid grid-cols-2 gap-3 pt-1">
                      <div>
                        <label class="font-bold text-slate-700 block mb-1">Base Paint Color</label>
                        <input type="color" id="color-picker-1" value="#dc2626" class="w-full h-8 rounded border border-slate-300 cursor-pointer p-0.5" onchange="updatePaintMixer()">
                      </div>
                      <div>
                        <label class="font-bold text-slate-700 block mb-1">Secondary Blend</label>
                        <input type="color" id="color-picker-2" value="#1e3a8a" class="w-full h-8 rounded border border-slate-300 cursor-pointer p-0.5" onchange="updatePaintMixer()">
                      </div>
                    </div>
                  </div>
                </div>`
            },
            projects: {
                id: 'projects',
                title: '📁 Projects & Bid Requests',
                w: 6, h: 5,
                getContent: () => {
                    const currentProjects = window.CUSTOMER_DATA.projects.current;
                    const hasCurrent = currentProjects && currentProjects.length > 0;

                    let currentHtml = hasCurrent ? currentProjects.map(p => `
                        <div class="p-3 border border-slate-200 rounded-lg bg-white space-y-2">
                          <div class="flex justify-between items-start">
                            <div>
                              <p class="font-bold text-slate-900 text-sm">${p.title}</p>
                              <p class="text-slate-500 text-[11px]">Submitted: ${p.date}</p>
                            </div>
                            <span class="px-2 py-0.5 text-[10px] font-bold bg-amber-100 text-amber-800 rounded">${p.status}</span>
                          </div>
                          <p class="text-slate-600">${p.description}</p>
                        </div>
                    `).join('') : `
                        <div class="p-8 border border-dashed border-slate-300 rounded-lg bg-slate-50/50 text-center space-y-2">
                          <p class="text-slate-600 font-medium">No active projects or pending bid requests.</p>
                          <p class="text-slate-400 text-[11px]">Click "Request New Bid" below to start your first project estimate.</p>
                        </div>
                    `;

                    return `
                    <div class="grid-stack-item-content" data-block-id="projects">
                      <div class="widget-header">
                        <span class="font-bold text-xs text-slate-800">📁 Projects & Bid Requests</span>
                        <button type="button" onclick="removeBlock('projects')" class="text-slate-400 hover:text-slate-600 text-sm font-bold">&times;</button>
                      </div>
                      <div class="p-4 text-xs space-y-4 overflow-y-auto">
                        <div class="flex justify-between items-center border-b pb-2">
                          <div class="flex gap-2">
                            <span class="px-2.5 py-1 bg-slate-900 text-white font-bold rounded">Active (${currentProjects.length})</span>
                          </div>
                          <button class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1 rounded shadow-sm transition">+ Request New Bid</button>
                        </div>
                        ${currentHtml}
                      </div>
                    </div>`;
                }
            },
            invoices: {
                id: 'invoices',
                title: '💳 Invoices & Payments',
                w: 4, h: 5,
                getContent: () => {
                    const invoices = window.CUSTOMER_DATA.invoices;
                    const hasInvoices = invoices && invoices.length > 0;

                    let invoiceListHtml = hasInvoices ? invoices.map(inv => `
                        <div class="p-2 border rounded flex justify-between items-center bg-white">
                          <div>
                            <p class="font-bold text-slate-800">${inv.id}</p>
                            <p class="text-slate-400 text-[10px]">${inv.date}</p>
                          </div>
                          <span class="font-bold text-slate-700">$${inv.amount.toFixed(2)}</span>
                        </div>
                    `).join('') : `
                        <p class="text-slate-400 text-[11px] italic py-2">No past invoice history found.</p>
                    `;

                    return `
                    <div class="grid-stack-item-content" data-block-id="invoices">
                      <div class="widget-header">
                        <span class="font-bold text-xs text-slate-800">💳 Payments & Billing</span>
                        <button type="button" onclick="removeBlock('invoices')" class="text-slate-400 hover:text-slate-600 text-sm font-bold">&times;</button>
                      </div>
                      <div class="p-4 text-xs space-y-3 overflow-y-auto">
                        <div class="p-3 bg-slate-50 border border-slate-200 rounded-lg flex justify-between items-center">
                          <div>
                            <p class="text-[10px] uppercase font-bold text-slate-500">Balance Due</p>
                            <p class="text-lg font-black text-slate-800">$0.00</p>
                          </div>
                          <span class="text-xs font-bold text-emerald-700 bg-emerald-100 px-2 py-1 rounded">No Unpaid Invoices</span>
                        </div>
                        <div class="space-y-2">
                          <p class="font-bold text-slate-700 text-[11px]">Recent Invoices</p>
                          ${invoiceListHtml}
                        </div>
                      </div>
                    </div>`;
                }
            },
            settings: {
                id: 'settings',
                title: '⚙️ Account & Profile Settings',
                w: 4, h: 4,
                getContent: () => {
                    const prof = window.CUSTOMER_DATA.profile;
                    return `
                    <div class="grid-stack-item-content" data-block-id="settings">
                      <div class="widget-header">
                        <span class="font-bold text-xs text-slate-800">⚙️ Account Settings</span>
                        <button type="button" onclick="removeBlock('settings')" class="text-slate-400 hover:text-slate-600 text-sm font-bold">&times;</button>
                      </div>
                      <div class="p-4 text-xs space-y-3 overflow-y-auto">
                        <div class="grid grid-cols-2 gap-2">
                          <div>
                            <label class="font-bold text-slate-600 block mb-1">Full Name</label>
                            <input type="text" id="prof-name" placeholder="No name on file" value="${prof.name}" class="w-full border rounded p-1.5 font-medium placeholder:italic placeholder:text-slate-300">
                          </div>
                          <div>
                            <label class="font-bold text-slate-600 block mb-1">Phone Number</label>
                            <input type="text" id="prof-phone" placeholder="No phone on file" value="${prof.phone}" class="w-full border rounded p-1.5 font-medium placeholder:italic placeholder:text-slate-300">
                          </div>
                        </div>
                        <div>
                          <label class="font-bold text-slate-600 block mb-1">Property Address</label>
                          <input type="text" id="prof-address" placeholder="No property address specified" value="${prof.address}" class="w-full border rounded p-1.5 font-medium placeholder:italic placeholder:text-slate-300">
                        </div>
                        <button type="button" onclick="saveProfileDetails()" class="bg-slate-900 text-white font-bold px-3 py-1.5 rounded">Save Account Details</button>
                      </div>
                    </div>`;
                }
            },
            budget: {
                id: 'budget',
                title: '📊 Project Cost Estimator',
                w: 4, h: 4,
                getContent: () => `
                <div class="grid-stack-item-content" data-block-id="budget">
                  <div class="widget-header">
                    <span class="font-bold text-xs text-slate-800">📊 Project Cost Estimator</span>
                    <button type="button" onclick="removeBlock('budget')" class="text-slate-400 hover:text-slate-600 text-sm font-bold">&times;</button>
                  </div>
                  <div class="p-4 text-xs space-y-3 overflow-y-auto">
                    <div class="flex justify-between items-center"><span class="text-slate-600 font-medium">Est. Labor Hours:</span><input id="calc-hours" type="number" placeholder="0" class="w-20 border rounded p-1 text-right font-bold" oninput="recalcBudget()"></div>
                    <div class="flex justify-between items-center"><span class="text-slate-600 font-medium">Materials Cost ($):</span><input id="calc-mat" type="number" placeholder="0.00" class="w-20 border rounded p-1 text-right font-bold" oninput="recalcBudget()"></div>
                    <div class="border-t pt-2 flex justify-between font-bold text-slate-900 text-sm"><span>Project Total:</span><span id="calc-total" class="text-slate-900">$0.00</span></div>
                  </div>
                </div>`
            }
        };

        let activeBlocks = new Set();
        let grid;

        /* INTERACTIVE PAINT MIXER STUDIO CANVAS ENGINE */
        let mixerTime = 0;
        let mixerAnimId = null;

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 220, g: 38, b: 38 };
        }

        function animatePaintMixer() {
            const canvas = document.getElementById('paint-mixer-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            const parent = canvas.parentElement;
            if (parent && (canvas.width !== parent.clientWidth / 2)) {
                canvas.width = Math.max(120, Math.floor(parent.clientWidth / 2));
                canvas.height = 90;
            }

            const w = canvas.width;
            const h = canvas.height;
            if (w === 0 || h === 0) return;

            const color1Hex = document.getElementById('color-picker-1')?.value || '#dc2626';
            const color2Hex = document.getElementById('color-picker-2')?.value || '#1e3a8a';

            const c1 = hexToRgb(color1Hex);
            const c2 = hexToRgb(color2Hex);

            mixerTime += 0.018;
            const imgData = ctx.createImageData(w, h);
            const data = imgData.data;

            let index = 0;
            for (let y = 0; y < h; y++) {
                const ny = y / h;
                for (let x = 0; x < w; x++) {
                    const nx = x / w;

                    const swirl1 = Math.sin(nx * 5 + mixerTime + Math.cos(ny * 4 - mixerTime));
                    const swirl2 = Math.cos(ny * 6 - mixerTime * 1.2 + Math.sin(nx * 3 + mixerTime));
                    const swirl3 = Math.sin((nx + ny) * 4 + swirl1 * 1.8);

                    let factor = (swirl1 + swirl2 + swirl3 + 3) / 6;
                    factor = Math.max(0, Math.min(1, factor));

                    data[index]     = Math.round(c1.r * (1 - factor) + c2.r * factor);
                    data[index + 1] = Math.round(c1.g * (1 - factor) + c2.g * factor);
                    data[index + 2] = Math.round(c1.b * (1 - factor) + c2.b * factor);
                    data[index + 3] = 255;
                    index += 4;
                }
            }

            ctx.putImageData(imgData, 0, 0);
            mixerAnimId = requestAnimationFrame(animatePaintMixer);
        }

        function updatePaintMixer() {
            if (mixerAnimId) cancelAnimationFrame(mixerAnimId);
            animatePaintMixer();
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateDashboardHeader();

            grid = GridStack.init({
                cellHeight: 80,
                margin: 12,
                handle: '.widget-header',
                resizable: { handles: 'se, sw' }
            });

            addBlock('tier');
            addBlock('mixer');
            addBlock('projects');
            addBlock('invoices');
            addBlock('budget');
            addBlock('settings');

            setTimeout(updatePaintMixer, 100);
        });

        function updateDashboardHeader() {
            const name = window.CUSTOMER_DATA?.profile?.name;
            const greetingEl = document.getElementById('welcome-greeting-text');
            if (greetingEl) {
                greetingEl.innerText = name ? `Welcome back, ${name}!` : 'Welcome back!';
            }
        }

        function openBlockCatalog() {
            const container = document.getElementById('catalog-items-container');
            if (!container) return;
            container.innerHTML = '';

            Object.values(PREMADE_BLOCKS).forEach(block => {
                const isActive = activeBlocks.has(block.id);
                const card = document.createElement('div');
                card.className = `p-3 border rounded-lg flex flex-col justify-between space-y-2 ${isActive ? 'bg-slate-50 border-slate-200' : 'bg-white border-slate-300'}`;
                card.innerHTML = `
                    <div>
                        <p class="font-bold text-xs text-slate-800">${block.title}</p>
                        <p class="text-[10px] text-slate-500">${isActive ? 'On Dashboard' : 'Available in Catalog'}</p>
                    </div>
                    <button type="button" onclick="${isActive ? `removeBlock('${block.id}')` : `addBlock('${block.id}')`}" 
                      class="text-xs px-2.5 py-1 rounded font-bold ${isActive ? 'bg-rose-100 text-rose-700 hover:bg-rose-200' : 'bg-slate-900 text-white hover:bg-slate-800'}">
                      ${isActive ? 'Remove' : '+ Add'}
                    </button>
                `;
                container.appendChild(card);
            });

            document.getElementById('block-catalog-modal')?.classList.remove('hidden');
        }

        function closeBlockCatalog() {
            document.getElementById('block-catalog-modal')?.classList.add('hidden');
        }

        function addBlock(blockId) {
            const block = PREMADE_BLOCKS[blockId];
            if (!block || !grid || activeBlocks.has(blockId)) return;

            grid.addWidget({ w: block.w, h: block.h, content: block.getContent() });
            activeBlocks.add(blockId);
            openBlockCatalog();

            if (blockId === 'mixer') {
                setTimeout(updatePaintMixer, 50);
            }
        }

        function removeBlock(blockId) {
            if (!grid) return;
            const el = document.querySelector(`[data-block-id="${blockId}"]`)?.closest('.grid-stack-item');
            if (el) {
                grid.removeWidget(el);
                activeBlocks.delete(blockId);
                openBlockCatalog();
            }
        }

        function recalcBudget() {
            const hrs = parseFloat(document.getElementById('calc-hours')?.value || 0);
            const mat = parseFloat(document.getElementById('calc-mat')?.value || 0);
            const total = (hrs * 65) + mat;
            const el = document.getElementById('calc-total');
            if (el) {
                el.innerText = `$${total.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
                if (total > 0) {
                    el.className = 'text-emerald-700 font-bold';
                } else {
                    el.className = 'text-slate-900 font-bold';
                }
            }
        }

        function saveProfileDetails() {
            const nameVal = document.getElementById('prof-name')?.value || '';
            window.CUSTOMER_DATA.profile.name = nameVal;
            window.CUSTOMER_DATA.profile.phone = document.getElementById('prof-phone')?.value || '';
            window.CUSTOMER_DATA.profile.address = document.getElementById('prof-address')?.value || '';
            
            updateDashboardHeader();
            alert('Account details saved!');
        }

        function saveLayout() {
            if (!grid) return;
            localStorage.setItem('hp_dashboard_layout', JSON.stringify(grid.save()));
            alert('Layout configuration saved!');
        }
    </script>
</body>
</html>
