<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard | Handyman Painting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .brand-red { color: #E31E24; }
        .bg-brand-red { background-color: #E31E24; }
        .bg-brand-black { background-color: #1A1A1A; }
    </style>
    <script type="text/javascript">(function(w,s){var e=document.createElement("script");e.type="text/javascript";e.async=true;e.src="https://cdn.pagesense.io/js/934654246/e3589ba4a5494620b8dfd95a7d650578.js";var x=document.getElementsByTagName("script")[0];x.parentNode.insertBefore(e,x);})(window,"script");</script>
</head>
<body class="bg-zinc-100 min-h-screen text-slate-900 flex flex-col justify-between">
    <script>
        if (localStorage.getItem("isLoggedIn") !== "true") {
            window.location.href = "login.html";
        }
        function getUserClaims() {
            return { name: "Jesse Bautista III", email: "jessebautistaiii@gmail.com" };
        }
    </script>
    <header class="bg-brand-black text-white py-3 border-b-4 border-brand-red shadow-md">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <span class="text-lg font-black tracking-wider uppercase">Client Portal</span>
            <div class="flex items-center space-x-4">
                <a href="index.html" class="text-xs font-bold uppercase text-zinc-300 hover:text-white transition">Main Site</a>
                <button onclick="localStorage.clear(); window.location.href='login.html';" class="bg-brand-red text-white px-3 py-1 rounded text-xs font-bold uppercase">Log Out</button>
            </div>
        </div>
    </header>
    <main class="container mx-auto px-4 py-6 flex-grow">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-6">
                <div id="sec-header-greeting"></div>
                <div id="sec-workflow-status"></div>
                <div id="sec-schedule-assessment"></div>
                <div id="sec-project-bids"></div>
                <div id="sec-paint-studio"></div>
                <div id="sec-paint-calculator"></div>
                <div id="sec-budget-estimator"></div>
                <div id="sec-checklist-warranty"></div>
                <div id="sec-job-photos"></div>
                <div id="sec-invoices-payments"></div>
                <div id="sec-profile-property"></div>
            </div>
            <div class="space-y-6">
                <div id="sec-weather-widget"></div>
                <div id="sec-account-overview"></div>
                <div id="sec-direct-dispatch"></div>
            </div>
        </div>
    </main>
    <footer class="bg-brand-black text-zinc-500 py-4 text-center text-xs border-t border-zinc-800">
        &copy; 2026 HANDYMAN PAINTING L.L.C. | AUTHENTICATED CLIENT SESSION
    </footer>
    <script>
        async function loadComponentSafely(targetId, componentPath) {
            const container = document.getElementById(targetId);
            if (!container) return;
            try {
                const response = await fetch(componentPath);
                if (!response.ok) throw new Error('Error');
                container.innerHTML = await response.text();
            } catch (e) {
                container.innerHTML = '<div class="p-3 text-xs text-red-600 bg-red-50 border border-red-200 rounded">⚠️ Failed to load component: ' + componentPath + '</div>';
            }
        }
        document.addEventListener("DOMContentLoaded", async function() {
            await Promise.allSettled([
                loadComponentSafely("sec-header-greeting", "components/header-greeting.html"),
                loadComponentSafely("sec-workflow-status", "components/workflow-status.html"),
                loadComponentSafely("sec-schedule-assessment", "components/schedule-assessment.html"),
                loadComponentSafely("sec-project-bids", "components/project-bids.html"),
                loadComponentSafely("sec-paint-studio", "components/paint-studio.html"),
                loadComponentSafely("sec-paint-calculator", "components/paint-calculator.html"),
                loadComponentSafely("sec-budget-estimator", "components/budget-estimator.html"),
                loadComponentSafely("sec-checklist-warranty", "components/checklist-warranty.html"),
                loadComponentSafely("sec-job-photos", "components/job-photos.html"),
                loadComponentSafely("sec-invoices-payments", "components/invoices-payments.html"),
                loadComponentSafely("sec-profile-property", "components/profile-property.html"),
                loadComponentSafely("sec-weather-widget", "components/weather-widget.html"),
                loadComponentSafely("sec-account-overview", "components/account-overview.html"),
                loadComponentSafely("sec-direct-dispatch", "components/direct-dispatch.html")
            ]);
        });
        async function handleManualSearch() {
            const input = document.getElementById('citySearchInput');
            if (!input) return alert('Search input not found.');
            const query = input.value.trim();
            if (!query) return alert('Enter a city or ZIP.');
            try {
                const res = await fetch('https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(query) + '&count=1');
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    const loc = data.results[0];
                    if (typeof fetchWeather === 'function') {
                        fetchWeather(loc.latitude, loc.longitude, loc.name + ', ' + (loc.admin1 || ''), 'Manual Search');
                    } else {
                        alert('Found: ' + loc.name);
                    }
                } else {
                    alert('Location not found.');
                }
            } catch (e) {
                alert('Search failed.');
            }
        }
    
        function toggleEditMode() {
            const el = document.getElementById("edit-container");
            if (el) {
                el.classList.toggle("hidden");
            } else {
                console.log("Toggle edit mode triggered: No edit container found.");
            }
        }
    </script>
</body>
</html>
