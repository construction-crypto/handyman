<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Official Bid Request Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-100 p-4 md:p-8 font-sans">
  <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg border border-zinc-200 overflow-hidden p-6">
    <h3 class="font-black text-2xl uppercase tracking-wide mb-2">Request On-Site Bid</h3>
    <form onsubmit="alert('Bid Submitted Successfully!'); event.preventDefault();" class="space-y-4 text-xs">
      <div><label class="block font-bold mb-1">Full Name</label><input type="text" required class="w-full border p-2 rounded"></div>
      <div><label class="block font-bold mb-1">Phone Number</label><input type="tel" required class="w-full border p-2 rounded"></div>
      <button type="submit" class="w-full bg-red-600 text-white font-bold py-3 rounded uppercase">Submit Bid Request</button>
    </form>
  </div>
</body>
</html>
